# Pytest configuration.
#
# `pythonpath = .` is the important line. The suite imports `server`, `agent`,
# `vigil`, and `tools` as top-level packages, and without this it only works when
# invoked as `python -m pytest` from the repository root — that form happens to put
# the cwd on `sys.path`, while a bare `pytest tests/` does not. Pinning it here
# means both spellings work, and so does running from a subdirectory.
[pytest]
pythonpath = .
testpaths = tests
addopts = --strict-markers

# Two third-party deprecations, silenced by exact message so that anything new —
# including anything from this project — still shows up in the summary. Without
# these, one model load per test emits the joblib warning and the run ends with
# ~1,900 lines of noise, which is the same as having no warning summary at all.
#
#   joblib   — assigns to `ndarray.shape` when unpickling; deprecated in NumPy 2.5
#   starlette — `TestClient` still imports httpx 0.x
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
